# =====================================================================
# GitHub Actions CI — 编译 DeltaHarmonica 越狱插件（roothide）
#
# 参照 roothide 项目成功模板，关键点：
#   - actions/checkout + submodules:recursive 拉 roothide/theos（含 dm.pl）
#   - brew 安装 ldid（签名工具）和 GNU make
#   - 用 zip 下载 theos/sdks 并缓存
#   - THEOS_PACKAGE_SCHEME=roothide 传参编译
# =====================================================================

name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVICE_TARGET: "iphone:clang:16.5:15.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos（roothide fork，含子模块）
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: install deps（ldid + GNU make）
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master
          echo "=== 已安装的 SDK ==="
          ls -la theos/sdks/

      - name: 验证工具链
        run: |
          set -x
          xcodebuild -version
          clang --version
          echo "THEOS=$THEOS"
          echo "=== 验证 dm.pl（关键：CI 之前报 requires dm.pl）==="
          ls -la "$THEOS/bin/dm.pl" "$THEOS/vendor/dm.pl/dm.pl" 2>&1 || echo "⚠️ dm.pl 缺失"
          echo "=== 验证 ldid ==="
          which ldid && ldid 2>&1 | head -2 || echo "⚠️ ldid 缺失"

      - name: build roothide
        run: |
          set -x
          make clean || true
          make package \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeltaHarmonica-roothide-package
          path: packages/*.deb
          if-no-files-found: error
