# =====================================================================
# GitHub Actions CI — 编译 DeltaHarmonica 越狱插件（roothide）
#
# 方案：
#   - macOS runner（自带 Xcode + iOS 交叉工具链，theos 官方要求）
#   - roothide/theos fork（必须 --recursive 拉子模块，否则缺 dm.pl）
#   - theos/sdks 社区 SDK（iPhoneOS16.5.sdk，含私有框架 tbd）
#
# 说明：runner 在 GitHub 机房，直连 github.com 最快最稳；
#       USE_MIRROR=true 可切 gh-proxy 加速（国内/受限网络场景）。
# =====================================================================

name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      USE_MIRROR:
        description: '使用 GitHub 加速镜像（true/false，默认 false 直连）'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: "${{ github.workspace }}/theos"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 决定是否使用加速镜像
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "USE_MIRROR=${{ github.event.inputs.USE_MIRROR }}" >> "$GITHUB_ENV"
          else
            echo "USE_MIRROR=false" >> "$GITHUB_ENV"
          fi

      - name: 安装 roothide/theos（含子模块，直连）
        if: env.USE_MIRROR != 'true'
        run: |
          set -eux
          # 关键：--recursive 拉取 vendor/dm.pl、logos、headers、lib 等子模块
          rm -rf "$THEOS"
          git clone --depth 1 --recursive \
            https://github.com/roothide/theos.git "$THEOS"
          echo "=== theos 结构验证 ==="
          ls "$THEOS"
          echo "--- bin/dm.pl 是否存在（CI 报错的关键） ---"
          ls -la "$THEOS/bin/dm.pl" "$THEOS/vendor/dm.pl/dm.pl" 2>&1 || true

      - name: 安装 roothide/theos（含子模块，加速镜像）
        if: env.USE_MIRROR == 'true'
        run: |
          set -eux
          rm -rf "$THEOS"
          # 镜像模式下，git clone 主仓库走镜像，子模块 URL 用 insteadOf 重写
          git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --recursive \
            https://gh-proxy.com/https://github.com/roothide/theos.git "$THEOS"
          ls "$THEOS/bin/dm.pl" 2>&1 || true

      - name: 安装 iOS SDK（iPhoneOS16.5.sdk）
        run: |
          set -eux
          SDKS_REPO_URL="https://github.com/theos/sdks.git"
          if [ "$USE_MIRROR" = "true" ]; then
            SDKS_REPO_URL="https://gh-proxy.com/${SDKS_REPO_URL}"
          fi
          echo "拉取 theos/sdks：$SDKS_REPO_URL"
          rm -rf /tmp/theos-sdks
          git clone --depth 1 "$SDKS_REPO_URL" /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "=== SDK 验证 ==="
          ls -la "$THEOS/sdks/iPhoneOS16.5.sdk/"

      - name: 验证工具链
        run: |
          set -eux
          xcodebuild -version
          clang --version
          echo "THEOS=$THEOS"
          echo "=== 验证 dm.pl（README 排错的关键文件）==="
          ls -la "$THEOS/bin/dm.pl" 2>&1 || echo "⚠️ dm.pl 缺失，检查子模块"

      - name: 编译 .deb
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          make clean || true
          make package
          echo "=== 产物 ==="
          ls -la packages/

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: DeltaHarmonica-deb
          path: packages/*.deb
          if-no-files-found: error
